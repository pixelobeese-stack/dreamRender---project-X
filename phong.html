<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sphere • Glass Refraction</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #E2E4E7;
  font-family: sans-serif;
  padding: 80px 10px 20px;
}

/* Top Bar */
.top-bar {
  position: fixed;
  top:0; left:0; right:0;
  background: white;
  padding:12px 15px;
  display:flex;
  gap:10px;
  align-items:center;
  border-bottom:1px solid #ddd;
  flex-wrap:wrap;
  z-index:10;
}
.btn {
  padding:8px 14px;
  border:1px solid #ccc;
  border-radius:8px;
  background:#f8f9fa;
  cursor:pointer;
}
.btn.active {
  background:#222;
  color:white;
  border-color:#222;
}
.palette {
  display:flex;
  gap:6px;
  margin-left:10px;
}
.swatch {
  width:24px; height:24px;
  border-radius:50%;
  border:2px solid transparent;
  cursor:pointer;
}
.swatch.selected { border-color:#000; }

/* Preview */
.preview-box {
  background:white;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
}
canvas {
  display:block;
  margin:0 auto;
  background:#111;
  border-radius:8px;
}
.controls {
  margin-top:15px;
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
  gap:12px;
}
.control-item {
  display:flex;
  flex-direction:column;
  gap:4px;
  font-size:14px;
}

/* Grid */
.grid-box {
  background:white;
  border-radius:12px;
  padding:15px;
  overflow:auto;
  max-height:50vh;
}
.grid {
  display:grid;
  grid-template-columns:repeat(64, 1fr);
  gap:1px;
  width:fit-content;
}
.cell {
  width:12px; height:12px;
  border-radius:50%;
  background:#ddd;
  border:none;
  cursor:pointer;
}
.cell.filled { background:var(--c); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useEffect, useMemo } = React;

const GRID = 64;
const LAYERS = 64;
const DOT_RADIUS = 2.5;
const SPACING = 3.5;
const COLORS = ['#e63946','#f4a261','#e9c46a','#2a9d8f','#8ecae6','#ffb703','#ffffff','#111'];
const MAX_LIGHT_DISTANCE = 45;
const GLASS_IOR = 1.18;         // Glass-like index of refraction
const FRESNEL_POWER = 3.2;      // Edge glow sharpness
const REFRACTION_AMOUNT = 0.65; // Refracted light influence
const TRANSMISSION = 0.72;      // Base light passing through glass
const SPECULAR_POWER = 72;      // Tight glossy highlight
const SPECULAR_AMOUNT = 0.36;   // Specular intensity

const key = (x,y,z) => `${x},${y},${z}`;
const project = (x,y,z,rot) => {
  const rad = rot * Math.PI / 180;
  const cx = x - GRID/2;
  const cy = y - GRID/2;
  return {
    x: cx*Math.cos(rad) - cy*Math.sin(rad),
    y: cx*Math.sin(rad) + cy*Math.cos(rad) - z*0.5
  };
};

const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const dot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
const normalize = (v) => {
  const len = Math.hypot(v.x, v.y, v.z) || 1;
  return { x: v.x / len, y: v.y / len, z: v.z / len };
};
const refract = (incident, normal, eta) => {
  const cosi = clamp(dot(incident, normal), -1, 1);
  const k = 1 - eta * eta * (1 - cosi * cosi);
  if (k < 0) return { x: 0, y: 0, z: 0 };
  return {
    x: eta * incident.x - (eta * cosi + Math.sqrt(k)) * normal.x,
    y: eta * incident.y - (eta * cosi + Math.sqrt(k)) * normal.y,
    z: eta * incident.z - (eta * cosi + Math.sqrt(k)) * normal.z
  };
};

// === Glass-like lighting + refraction ===
const calculateGlassLighting = (dotX, dotY, dotZ, lightX, lightY, lightZ, centerX, centerY, centerZ) => {
  // Distance-based diffuse lighting
  const dx = dotX - lightX;
  const dy = dotY - lightY;
  const dz = dotZ - lightZ;
  const distance = Math.hypot(dx, dy, dz);
  const diffuse = Math.max(0.2, 1 - (distance / MAX_LIGHT_DISTANCE));

  const normal = normalize({
    x: dotX - centerX,
    y: dotY - centerY,
    z: dotZ - centerZ
  });

  // Camera is placed in front of the voxel sphere.
  const camera = { x: centerX, y: centerY, z: -50 };
  const viewDir = normalize({
    x: camera.x - dotX,
    y: camera.y - dotY,
    z: camera.z - dotZ
  });
  const lightDir = normalize({ x: -dx, y: -dy, z: -dz });
  const halfDir = normalize({
    x: lightDir.x + viewDir.x,
    y: lightDir.y + viewDir.y,
    z: lightDir.z + viewDir.z
  });

  // Fresnel term brightens edges like glass reflections.
  const fresnel = Math.pow(1 - Math.max(0, dot(normal, viewDir)), FRESNEL_POWER);
  const specular = Math.pow(Math.max(0, dot(normal, halfDir)), SPECULAR_POWER) * SPECULAR_AMOUNT;

  // Approximate internal bending of view rays through the surface.
  const refracted = normalize(refract({ x: -viewDir.x, y: -viewDir.y, z: -viewDir.z }, normal, 1 / GLASS_IOR));
  const refractiveLight = Math.pow(Math.max(0, dot(refracted, lightDir)), 2.2) * REFRACTION_AMOUNT;

  return { diffuse, fresnel, refractiveLight, specular };
};

const applyGlassLighting = (hex, diffuse, fresnel, refractiveLight, specular) => {
  const h = hex.replace('#','');
  const baseR = parseInt(h.substr(0,2),16);
  const baseG = parseInt(h.substr(2,2),16);
  const baseB = parseInt(h.substr(4,2),16);
  const edgeGlow = fresnel * 80;
  const refractedGlow = refractiveLight * 135;
  const specularGlow = specular * 255;
  const r = Math.min(255, Math.round(baseR * diffuse * TRANSMISSION + edgeGlow + refractedGlow * 0.5 + specularGlow));
  const g = Math.min(255, Math.round(baseG * diffuse * TRANSMISSION + edgeGlow + refractedGlow * 0.75 + specularGlow));
  const b = Math.min(255, Math.round(baseB * diffuse * TRANSMISSION + edgeGlow * 1.3 + refractedGlow + specularGlow));
  const alpha = clamp(0.4 + diffuse * 0.24 + fresnel * 0.24 + refractiveLight * 0.16 + specular * 0.12, 0.4, 0.95);
  return `rgba(${r},${g},${b},${alpha})`;
};

// === Create Default Sphere ===
const createSphere = (radius = 18, color = '#8ecae6') => {
  const dots = new Map();
  const center = GRID / 2;
  for (let x = 0; x < GRID; x++) {
    for (let y = 0; y < GRID; y++) {
      for (let z = 0; z < LAYERS; z++) {
        const dx = x - center;
        const dy = y - center;
        const dz = z - center;
        if (dx*dx + dy*dy + dz*dz <= radius*radius) {
          dots.set(key(x,y,z), color);
        }
      }
    }
  }
  return dots;
};

function App() {
  const [dots, setDots] = useState(() => createSphere(18, '#8ecae6'));
  const [color, setColor] = useState('#8ecae6');
  const [rot, setRot] = useState(45);
  const [layer, setLayer] = useState(32);
  const [mode, setMode] = useState('draw');
  const [lightPos, setLightPos] = useState({x:10, y:10, z:10});
  
  const canvasRef = useRef(null);
  const sphereCenter = GRID / 2;

  const clickCell = (x,y) => {
    const k = key(x,y,layer);
    setDots(prev => {
      const m = new Map(prev);
      mode==='erase' ? m.delete(k) : m.set(k,color);
      return m;
    });
  };

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const size = 600;
    canvas.width = size;
    canvas.height = size;

    ctx.clearRect(0,0,size,size);
    const cx = size/2, cy = size/2;

    const list = [];
    for (const [k,c] of dots) {
      const [x,y,z] = k.split(',').map(Number);
      list.push({x,y,z,baseColor:c});
    }
    list.sort((a,b) => a.x+a.y+a.z - (b.x+b.y+b.z));

    for (const d of list) {
      const { diffuse, fresnel, refractiveLight, specular } = calculateGlassLighting(
        d.x, d.y, d.z,
        lightPos.x, lightPos.y, lightPos.z,
        sphereCenter, sphereCenter, sphereCenter
      );
      const litColor = applyGlassLighting(d.baseColor, diffuse, fresnel, refractiveLight, specular);
      const p = project(d.x,d.y,d.z,rot);
      
      ctx.beginPath();
      ctx.arc(cx + p.x * SPACING, cy + p.y * SPACING, DOT_RADIUS, 0, Math.PI*2);
      ctx.fillStyle = litColor;
      ctx.fill();
    }
  }, [dots, rot, lightPos]);

  const cells = useMemo(() => {
    const arr = [];
    for (let y=0; y<GRID; y++) {
      for (let x=0; x<GRID; x++) {
        arr.push({x,y,filled: dots.has(key(x,y,layer)), c: dots.get(key(x,y,layer))});
      }
    }
    return arr;
  }, [dots, layer]);

  return (
    <>
      <div className="top-bar">
        <button className={"btn "+(mode==='draw'?'active':'')} onClick={()=>setMode('draw')}>Draw</button>
        <button className={"btn "+(mode==='erase'?'active':'')} onClick={()=>setMode('erase')}>Erase</button>
        <button className="btn" onClick={()=>setDots(createSphere(18, color))}>Reset Sphere</button>
        <div className="palette">
          {COLORS.map(c=>(
            <div key={c} className={"swatch "+(color===c?'selected':'')} style={{background:c}} onClick={()=>setColor(c)} />
          ))}
        </div>
      </div>

      <div className="preview-box">
        <h3 style={{marginBottom:10}}>Sphere • Glass Refraction</h3>
        <canvas ref={canvasRef} width="600" height="600"></canvas>
        <div className="controls">
          <div className="control-item">
            <span>Rotate: {rot}°</span>
            <input type="range" min="0" max="360" value={rot} onChange={e=>setRot(+e.target.value)} />
          </div>
          <div className="control-item">
            <span>View Layer: {layer+1}/{LAYERS}</span>
            <input type="range" min="0" max={LAYERS-1} value={layer} onChange={e=>setLayer(+e.target.value)} />
          </div>
          <div className="control-item">
            <span>Light X: {lightPos.x}</span>
            <input type="range" min="0" max={GRID} value={lightPos.x} onChange={e=>setLightPos(p=>({...p, x:+e.target.value}))} />
          </div>
          <div className="control-item">
            <span>Light Y: {lightPos.y}</span>
            <input type="range" min="0" max={GRID} value={lightPos.y} onChange={e=>setLightPos(p=>({...p, y:+e.target.value}))} />
          </div>
          <div className="control-item">
            <span>Light Z: {lightPos.z}</span>
            <input type="range" min="0" max={LAYERS-1} value={lightPos.z} onChange={e=>setLightPos(p=>({...p, z:+e.target.value}))} />
          </div>
        </div>
      </div>

      <div className="grid-box">
        <h3 style={{marginBottom:10}}>64×64 Grid Editor</h3>
        <div className="grid">
          {cells.map(cell=>(
            <button
              key={cell.x+'-'+cell.y}
              className={"cell "+(cell.filled?'filled':'')}
              style={cell.filled ? {'--c': cell.c} : {}}
              onClick={()=>clickCell(cell.x,cell.y)}
            />
          ))}
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
