<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sphere • Reflective Gold Shader</title>
<script src="https://unpkg.com/react@18/umd/react.development.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: #E2E4E7;
  font-family: sans-serif;
  padding: 80px 10px 20px;
}
.top-bar {
  position: fixed;
  top:0; left:0; right:0;
  background: white;
  padding:12px 15px;
  display:flex;
  gap:10px;
  align-items:center;
  border-bottom:1px solid #ddd;
  flex-wrap:wrap;
  z-index:10;
}
.btn {
  padding:8px 14px;
  border:1px solid #ccc;
  border-radius:8px;
  background:#f8f9fa;
  cursor:pointer;
}
.btn.active {
  background:#222;
  color:white;
  border-color:#222;
}
.palette {
  display:flex;
  gap:6px;
  margin-left:10px;
}
.swatch {
  width:24px; height:24px;
  border-radius:50%;
  border:2px solid transparent;
  cursor:pointer;
}
.swatch.selected { border-color:#000; }
.preview-box {
  background:white;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
}
canvas {
  display:block;
  margin:0 auto;
  background:#111;
  border-radius:8px;
}
.controls {
  margin-top:15px;
  display:grid;
  grid-template-columns:repeat(auto-fit, minmax(180px, 1fr));
  gap:12px;
}
.control-item {
  display:flex;
  flex-direction:column;
  gap:4px;
  font-size:14px;
}
.grid-box {
  background:white;
  border-radius:12px;
  padding:15px;
  overflow:auto;
  max-height:50vh;
}
.grid {
  display:grid;
  grid-template-columns:repeat(64, 1fr);
  gap:1px;
  width:fit-content;
}
.cell {
  width:12px; height:12px;
  border-radius:50%;
  background:#ddd;
  border:none;
  cursor:pointer;
}
.cell.filled { background:var(--c); }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useRef, useEffect, useMemo } = React;

const GRID = 64;
const LAYERS = 64;
const DOT_RADIUS = 2.5;
const SPACING = 3.5;
const COLORS = ['#FFD24A','#E7B236','#C99823','#FFDE7A','#B8831E','#ffffff','#111111'];
const MAX_LIGHT_DISTANCE = 45;
const SPECULAR_POWER = 48;
const SPECULAR_AMOUNT = 0.9;
const METAL_DIFFUSE = 0.78;
const GOLD_F0 = { r: 1.0, g: 0.86, b: 0.57 };

const key = (x,y,z) => `${x},${y},${z}`;
const clamp = (v, min, max) => Math.max(min, Math.min(max, v));
const dot = (a, b) => a.x * b.x + a.y * b.y + a.z * b.z;
const normalize = (v) => {
  const len = Math.hypot(v.x, v.y, v.z) || 1;
  return { x: v.x / len, y: v.y / len, z: v.z / len };
};
const project = (x,y,z,rot) => {
  const rad = rot * Math.PI / 180;
  const cx = x - GRID/2;
  const cy = y - GRID/2;
  return {
    x: cx*Math.cos(rad) - cy*Math.sin(rad),
    y: cx*Math.sin(rad) + cy*Math.cos(rad) - z*0.5
  };
};
const hexToRgb = (hex) => {
  const h = hex.replace('#', '');
  return {
    r: parseInt(h.substring(0,2), 16) || 0,
    g: parseInt(h.substring(2,4), 16) || 0,
    b: parseInt(h.substring(4,6), 16) || 0
  };
};
const getEnvironmentColor = (normal, viewDir) => {
  const sky = { r: 188, g: 206, b: 246 };
  const horizon = { r: 222, g: 198, b: 150 };
  const ground = { r: 96, g: 76, b: 44 };
  const t = clamp((normal.y + 1) * 0.5, 0, 1);
  const lowBlend = {
    r: ground.r + (horizon.r - ground.r) * (t * t),
    g: ground.g + (horizon.g - ground.g) * (t * t),
    b: ground.b + (horizon.b - ground.b) * (t * t)
  };
  const upBlend = {
    r: horizon.r + (sky.r - horizon.r) * Math.sqrt(t),
    g: horizon.g + (sky.g - horizon.g) * Math.sqrt(t),
    b: horizon.b + (sky.b - horizon.b) * Math.sqrt(t)
  };
  const viewLift = clamp(0.6 + Math.max(0, viewDir.z) * 0.4, 0.6, 1);
  return {
    r: Math.round((lowBlend.r * (1 - t) + upBlend.r * t) * viewLift),
    g: Math.round((lowBlend.g * (1 - t) + upBlend.g * t) * viewLift),
    b: Math.round((lowBlend.b * (1 - t) + upBlend.b * t) * viewLift)
  };
};
const calculateGoldLighting = (dotX, dotY, dotZ, lightX, lightY, lightZ, centerX, centerY, centerZ, reflectionStrength) => {
  const toLight = { x: lightX - dotX, y: lightY - dotY, z: lightZ - dotZ };
  const distance = Math.hypot(toLight.x, toLight.y, toLight.z);
  const lightDir = normalize(toLight);
  const normal = normalize({
    x: dotX - centerX,
    y: dotY - centerY,
    z: dotZ - centerZ
  });
  const camera = { x: centerX, y: centerY, z: -50 };
  const viewDir = normalize({
    x: camera.x - dotX,
    y: camera.y - dotY,
    z: camera.z - dotZ
  });
  const halfVec = normalize({
    x: lightDir.x + viewDir.x,
    y: lightDir.y + viewDir.y,
    z: lightDir.z + viewDir.z
  });
  const diffuse = Math.max(0.1, 1 - (distance / MAX_LIGHT_DISTANCE));
  const ndotl = Math.max(0, dot(normal, lightDir));
  const ndoth = Math.max(0, dot(normal, halfVec));
  const ndotv = Math.max(0, dot(normal, viewDir));
  const fresnel = Math.pow(1 - ndotv, 5);
  const reflection = clamp((0.08 + fresnel * 0.92) * reflectionStrength, 0, 1);
  const specular = Math.pow(ndoth, SPECULAR_POWER) * SPECULAR_AMOUNT * (0.35 + reflection * 0.65);
  const env = getEnvironmentColor(normal, viewDir);
  return { diffuse: diffuse * ndotl + 0.16, specular, reflection, env };
};
const applyGoldLighting = (hex, lighting) => {
  const base = hexToRgb(hex);
  const direct = lighting.diffuse * METAL_DIFFUSE;
  const refl = lighting.reflection;
  const spec = lighting.specular;
  const r = clamp(Math.round(
    base.r * direct +
    lighting.env.r * refl * GOLD_F0.r +
    255 * spec * GOLD_F0.r
  ), 0, 255);
  const g = clamp(Math.round(
    base.g * direct +
    lighting.env.g * refl * GOLD_F0.g +
    246 * spec * GOLD_F0.g
  ), 0, 255);
  const b = clamp(Math.round(
    base.b * direct +
    lighting.env.b * refl * GOLD_F0.b +
    208 * spec * GOLD_F0.b
  ), 0, 255);
  return `rgb(${r},${g},${b})`;
};
const createSphere = (radius = 18, color = '#FFD24A') => {
  const dots = new Map();
  const center = GRID / 2;
  for (let x = 0; x < GRID; x++) {
    for (let y = 0; y < GRID; y++) {
      for (let z = 0; z < LAYERS; z++) {
        const dx = x - center;
        const dy = y - center;
        const dz = z - center;
        if (dx*dx + dy*dy + dz*dz <= radius*radius) {
          dots.set(key(x,y,z), color);
        }
      }
    }
  }
  return dots;
};

function App() {
  const [dots, setDots] = useState(() => createSphere(18, '#FFD24A'));
  const [color, setColor] = useState('#FFD24A');
  const [rot, setRot] = useState(45);
  const [layer, setLayer] = useState(32);
  const [mode, setMode] = useState('draw');
  const [lightPos, setLightPos] = useState({x:10, y:10, z:10});
  const [reflectionStrength, setReflectionStrength] = useState(0.85);
  const canvasRef = useRef(null);
  const sphereCenter = GRID / 2;

  const clickCell = (x,y) => {
    const k = key(x,y,layer);
    setDots(prev => {
      const m = new Map(prev);
      mode==='erase' ? m.delete(k) : m.set(k,color);
      return m;
    });
  };

  useEffect(() => {
    const canvas = canvasRef.current;
    if (!canvas) return;
    const ctx = canvas.getContext('2d');
    const size = 600;
    canvas.width = size;
    canvas.height = size;
    ctx.clearRect(0,0,size,size);
    const cx = size/2, cy = size/2;

    const list = [];
    for (const [k,c] of dots) {
      const [x,y,z] = k.split(',').map(Number);
      list.push({x,y,z,baseColor:c});
    }
    list.sort((a,b) => a.x+a.y+a.z - (b.x+b.y+b.z));

    for (const d of list) {
      const lighting = calculateGoldLighting(
        d.x, d.y, d.z,
        lightPos.x, lightPos.y, lightPos.z,
        sphereCenter, sphereCenter, sphereCenter,
        reflectionStrength
      );
      const litColor = applyGoldLighting(d.baseColor, lighting);
      const p = project(d.x,d.y,d.z,rot);

      ctx.beginPath();
      ctx.arc(cx + p.x * SPACING, cy + p.y * SPACING, DOT_RADIUS, 0, Math.PI*2);
      ctx.fillStyle = litColor;
      ctx.fill();
    }
  }, [dots, rot, lightPos, reflectionStrength]);

  const cells = useMemo(() => {
    const arr = [];
    for (let y=0; y<GRID; y++) {
      for (let x=0; x<GRID; x++) {
        arr.push({x,y,filled: dots.has(key(x,y,layer)), c: dots.get(key(x,y,layer))});
      }
    }
    return arr;
  }, [dots, layer]);

  return (
    <>
      <div className="top-bar">
        <button className={"btn "+(mode==='draw'?'active':'')} onClick={()=>setMode('draw')}>Draw</button>
        <button className={"btn "+(mode==='erase'?'active':'')} onClick={()=>setMode('erase')}>Erase</button>
        <button className="btn" onClick={()=>setDots(createSphere(18, color))}>Reset Sphere</button>
        <div className="palette">
          {COLORS.map(c=>(
            <div key={c} className={"swatch "+(color===c?'selected':'')} style={{background:c}} onClick={()=>setColor(c)} />
          ))}
        </div>
      </div>

      <div className="preview-box">
        <h3 style={{marginBottom:10}}>Sphere • Reflective Gold Shader</h3>
        <canvas ref={canvasRef} width="600" height="600"></canvas>
        <div className="controls">
          <div className="control-item">
            <span>Rotate: {rot}°</span>
            <input type="range" min="0" max="360" value={rot} onChange={e=>setRot(+e.target.value)} />
          </div>
          <div className="control-item">
            <span>View Layer: {layer+1}/{LAYERS}</span>
            <input type="range" min="0" max={LAYERS-1} value={layer} onChange={e=>setLayer(+e.target.value)} />
          </div>
          <div className="control-item">
            <span>Light X: {lightPos.x}</span>
            <input type="range" min="0" max={GRID} value={lightPos.x} onChange={e=>setLightPos(p=>({...p, x:+e.target.value}))} />
          </div>
          <div className="control-item">
            <span>Light Y: {lightPos.y}</span>
            <input type="range" min="0" max={GRID} value={lightPos.y} onChange={e=>setLightPos(p=>({...p, y:+e.target.value}))} />
          </div>
          <div className="control-item">
            <span>Light Z: {lightPos.z}</span>
            <input type="range" min="0" max={LAYERS-1} value={lightPos.z} onChange={e=>setLightPos(p=>({...p, z:+e.target.value}))} />
          </div>
          <div className="control-item">
            <span>Reflection: {reflectionStrength.toFixed(2)}</span>
            <input type="range" min="0" max="1" step="0.01" value={reflectionStrength} onChange={e=>setReflectionStrength(+e.target.value)} />
          </div>
        </div>
      </div>

      <div className="grid-box">
        <h3 style={{marginBottom:10}}>64×64 Grid Editor</h3>
        <div className="grid">
          {cells.map(cell=>(
            <button
              key={cell.x+'-'+cell.y}
              className={"cell "+(cell.filled?'filled':'')}
              style={cell.filled ? {'--c': cell.c} : {}}
              onClick={()=>clickCell(cell.x,cell.y)}
            />
          ))}
        </div>
      </div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
